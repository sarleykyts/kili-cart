name: kilicart_app
description: KiliCart - Smart wishlist & flash-sale tracker for Kilimall.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  provider: ^6.1.2
  http: ^1.2.1
  shared_preferences: ^2.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  firebase_core: ^2.24.2
  firebase_messaging: ^14.7.1
  flutter_local_notifications: ^17.0.0
  share_plus: ^9.0.0
  url_launcher: ^6.2.1
  google_fonts: ^6.1.0
  intl: ^0.18.1
  uuid: ^4.3.3
  shimmer: ^3.0.0
  backdrop_filter: ^0.0.6
  connectivity_plus: ^6.0.3
  path_provider: ^2.1.2
  image_gallery_saver: ^2.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.7

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/logo.png
